[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-ppi"
dynamic = ["version"]
description = "TRACE-PPI: Tiered Record of Assignment-level Channel Evidence for overlapping protein module detection"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.21", "scipy>=1.7", "pandas>=1.3", "networkx>=2.6", "scikit-learn>=1.0",
  "matplotlib>=3.5", "pyyaml>=6.0", "markov-clustering>=0.0.6.dev0",
]

[project.scripts]
trace-ppi = "trace_ppi.cli:main"

[tool.setuptools]
packages = ["trace_ppi"]

[tool.setuptools.dynamic]
version = { attr = "trace_ppi.__version__" }
